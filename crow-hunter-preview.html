<head>
<meta charset="utf-8">
<title>CoCo Job Monitor — 烏羽の狩人メニューバーGIFプレビュー</title>
<style>
  body { margin:0; background:#070b14; color:#f1f5f9; font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans",sans-serif; padding:32px 24px 64px; }
  .wrap { max-width:1060px; margin:0 auto; }
  h1 { margin:0 0 8px; font-size:24px; }
  .sub { color:#94a3b8; font-size:13.5px; margin-bottom:24px; }
  code { background:#111c33; color:#7dd3fc; padding:2px 6px; border-radius:4px; font-family:"SF Mono",monospace; font-size:12px; }
  .sim-card { background:#0d1526; border:1px solid #223557; border-radius:14px; padding:22px; margin-bottom:28px; }
  .bar-row { display:grid; grid-template-columns:1fr 1fr; gap:16px; margin-bottom:18px; }
  .menubar-mock { height:34px; border-radius:8px; padding:0 16px; display:flex; align-items:center; justify-content:space-between; font-size:13px; font-weight:600; }
  .menubar-dark { background:#1c212e; color:#f8fafc; border:1px solid #334155; }
  .menubar-light { background:#e5e9f0; color:#0f172a; border:1px solid #cbd5e1; }
  .status-slot { display:inline-flex; align-items:center; gap:5px; padding:2px 8px; border-radius:5px; }
  .menubar-dark .status-slot { background:rgba(255,255,255,0.06); }
  .menubar-light .status-slot { background:rgba(0,0,0,0.06); }
  .pix { image-rendering:pixelated; }
  .inv-white { filter: brightness(0) invert(1); }
  .zoom-stage { display:flex; align-items:center; gap:24px; background:#080d19; border:1px solid #1c2c49; border-radius:10px; padding:18px 22px; margin-bottom:16px; }
  .btns { display:flex; flex-wrap:wrap; gap:8px; }
  button { background:#13203a; border:1px solid #2f4978; color:#e2e8f0; padding:8px 13px; border-radius:8px; font-size:12.5px; font-weight:700; cursor:pointer; }
  button.active { background:#0284c7; border-color:#38bdf8; color:#fff; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(310px,1fr)); gap:14px; }
  .card { background:#0d1526; border:1px solid #1e2f4d; border-radius:12px; padding:16px; }
  .card h3 { margin:0 0 6px; font-size:14.5px; display:flex; justify-content:space-between; }
  .card p { margin:0 0 12px; font-size:12.5px; color:#94a3b8; }
  .preview-strip { display:flex; align-items:center; gap:14px; background:#070c17; padding:10px 14px; border-radius:8px; border:1px solid #192742; }
</style>

<body>
<div class="wrap">
  <h1>CoCo Job Monitor — 烏羽の狩人 メニューバーGIFシミュレータ</h1>
  <div class="sub">配置先: <code>~/.snowflake/cortex/job-monitor/icons/</code>（同名の透過GIFを上書きすると再起動なしで自動ホットリロードされます）</div>

  <div class="sim-card">
    <div style="font-size:12px;color:#7dd3fc;font-weight:700;margin-bottom:10px">実寸 macOS メニューバー見え方シミュレーション (32×18pt Retina) ＆ 4倍拡大確認</div>
    <div class="bar-row">
      <div class="menubar-mock menubar-dark">
        <span style="color:#94a3b8;font-size:12px">Dark Mode Menu Bar</span>
        <div style="display:flex;align-items:center;gap:14px">
          <span class="status-slot">
            <img id="sim-dark-img" class="pix" width="32" height="18">
            <span id="sim-dark-txt"></span>
          </span>
          <span style="opacity:0.7">15:52</span>
        </div>
      </div>
      <div class="menubar-mock menubar-light">
        <span style="color:#475569;font-size:12px">Light Mode Menu Bar</span>
        <div style="display:flex;align-items:center;gap:14px">
          <span class="status-slot">
            <img id="sim-light-img" class="pix" width="32" height="18">
            <span id="sim-light-txt"></span>
          </span>
          <span style="opacity:0.7">15:52</span>
        </div>
      </div>
    </div>

    <div class="zoom-stage">
      <img id="sim-zoom-img" class="pix" width="192" height="108">
      <div>
        <div id="sim-state-title" style="font-size:16px;font-weight:800;margin-bottom:4px"></div>
        <div id="sim-state-meta" style="font-family:monospace;font-size:12.5px;color:#7dd3fc"></div>
      </div>
    </div>

    <div class="btns" id="mode-btns"></div>
  </div>

  <div class="grid" id="asset-cards"></div>
</div>

  lImg.className = "pix";
  document.getElementById("sim-dark-txt").textContent = active.txt;
  document.getElementById("sim-light-txt").textContent = active.txt;
  document.getElementById("sim-state-title").textContent = active.title;
  document.getElementById("sim-state-meta").textContent = `使用ファイル: ${active.sprite}.gif (${arr.length}コマ) / フレーム間隔: ${active.ms}ms (${(1000/active.ms).toFixed(1)} fps)`;
}

function selectPreset(p) {
  active = p; fIdx = 0;
  if (timer) clearInterval(timer);
  applyFrame();
  timer = setInterval(() => { fIdx++; applyFrame(); }, p.ms);
  document.querySelectorAll("#mode-btns button").forEach(b => b.classList.toggle("active", b.dataset.id === p.id));
}

const btnWrap = document.getElementById("mode-btns");
PRESETS.forEach(p => {
  const b = document.createElement("button");
  b.dataset.id = p.id;
  b.textContent = p.title;
  b.onclick = () => selectPreset(p);
  btnWrap.appendChild(b);
});

const META = [
  ["idle",    "idle.gif (3コマ)",    "モノクロ Template 自動反転 / 600ms周期"],
  ["run",     "run.gif (6コマ)",     "モノクロ Template 自動反転 / 130ms→85ms→55ms 可変速度"],
  ["wait",    "wait.gif (4コマ)",    "カラー固定 / 琥珀色の鐘＋発光リング (220ms)"],
  ["trouble", "trouble.gif (4コマ)", "カラー固定 / 片膝＋深紅の警告灯 (280ms)"],
  ["done",    "done.gif (4コマ)",    "カラー固定 / 新着未確認完了の青緑ランプ (320ms)"],
];
document.getElementById("asset-cards").innerHTML = META.map(([k, title, desc]) => `
  <div class="card">
    <h3><span>${title}</span><span style="color:#64748b;font-size:11px">64×36px</span></h3>
    <p>${desc}</p>
    <div class="preview-strip">
      <img src="${GIFS[k]}" class="pix ${k==="idle"||k==="run" ? "inv-white" : ""}" width="128" height="72">
      <span style="font-family:monospace;font-size:11px;color:#94a3b8">${k}.gif</span>
    </div>
  </div>
`).join("");

selectPreset(PRESETS[2]);
</script>
</body>
</html>
